# Builds the Google Play wrapper (a Trusted Web Activity: a thin Android shell that opens the web app full screen).
# Run it by hand: GitHub > Actions > "Android wrapper" > Run workflow. The web app itself updates by itself; this only needs
# running for the first upload, and again when Play requires a newer Android target (about once a year).
# Without the repository secrets below it makes a TEST build signed with a throwaway key (proves the pipeline, cannot be uploaded to Play).
#   Secrets (Settings > Secrets and variables > Actions): UPLOAD_KEYSTORE_B64, UPLOAD_KEYSTORE_PASSWORD
name: Android wrapper
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (a whole number higher than the last upload; 1 for the first)'
        default: '1'
      version_name:
        description: 'versionName'
        default: '1.0.0'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Point Bubblewrap at the preinstalled JDK and Android SDK
        run: |
          # Bubblewrap wants the SDK laid out as <sdk>/tools (the command line tools), <sdk>/build-tools, <sdk>/platforms, <sdk>/licenses;
          # the runner keeps the command line tools in cmdline-tools/latest, so link them into a folder of the shape Bubblewrap expects.
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" || true
          BW="$HOME/bw-sdk"; mkdir -p "$BW"
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$BW/tools"
          for d in build-tools platforms platform-tools licenses; do [ -e "$ANDROID_HOME/$d" ] && ln -sfn "$ANDROID_HOME/$d" "$BW/$d"; done
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$BW" > ~/.bubblewrap/config.json; cat ~/.bubblewrap/config.json
      - name: Signing key (real from secrets, otherwise a throwaway for a test build)
        id: key
        working-directory: android
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > upload.keystore; echo "mode=real" >> "$GITHUB_OUTPUT"
            echo "::add-mask::$KS_PASS"; echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"; echo "BUBBLEWRAP_KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 12); echo "::add-mask::$P"
            keytool -genkeypair -keystore upload.keystore -alias maxedhealth-upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=TEST ONLY"
            echo "mode=test" >> "$GITHUB_OUTPUT"; echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"; echo "BUBBLEWRAP_KEY_PASSWORD=$P" >> "$GITHUB_ENV"
          fi
      - name: Set the version
        working-directory: android
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open('twa-manifest.json')); m['appVersionCode'] = int('${{ inputs.version_code }}'); m['appVersion'] = '${{ inputs.version_name }}'
          json.dump(m, open('twa-manifest.json', 'w'), indent=2)
          PY
      - name: Build
        working-directory: android
        run: |
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json || true
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
          ls -la
      - name: Show the signing fingerprint (needed for assetlinks.json)
        working-directory: android
        run: keytool -list -v -keystore upload.keystore -alias maxedhealth-upload -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep -E "SHA256|Alias"
      - uses: actions/upload-artifact@v4
        with:
          name: maxedhealth-${{ steps.key.outputs.mode }}-build
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          retention-days: 7
