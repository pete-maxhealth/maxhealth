<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MaxedHealth — Carer View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c0f;
    --surface: #121418;
    --surface2: #1a1d23;
    --surface3: #22262e;
    --border: #2a2e38;
    --border2: #333844;
    --text: #e8eaf0;
    --text2: #8b90a0;
    --text3: #555a6a;
    --accent: #2deb8f;
    --accent-dim: rgba(45,235,143,0.12);
    --accent-glow: rgba(45,235,143,0.25);
    --green: #2deb8f;
    --green-dim: rgba(45,235,143,0.12);
    --yellow: #f5c542;
    --yellow-dim: rgba(245,197,66,0.12);
    --red: #ff5e5e;
    --red-dim: rgba(255,94,94,0.12);
    --blue: #38bdf8;
    --blue-dim: rgba(56,189,248,0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --glass-border: rgba(255,255,255,0.07);
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── LAYOUT ── */
  .page { max-width: 540px; margin: 0 auto; padding: 0 16px 48px; }

  /* ── HEADER ── */
  .header {
    padding: 32px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .header-brand {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 8px;
  }
  .header-name {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.1;
  }
  .header-sub {
    font-size: 13px;
    color: var(--text2);
    margin-top: 6px;
    font-family: 'Space Mono', monospace;
  }

  /* ── EXPIRED BANNER ── */
  .expired-banner {
    background: var(--red-dim);
    border: 1px solid var(--red);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--red);
  }

  /* ── SECTION TITLE ── */
  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text3);
    margin-bottom: 12px;
    margin-top: 28px;
  }

  /* ── TARGET CARDS ── */
  .target-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .target-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 12px;
    text-align: center;
  }
  .target-val {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
  }
  .target-label {
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'Space Mono', monospace;
  }
  .target-card.kcal .target-val { color: var(--blue); }
  .target-card.protein .target-val { color: var(--accent); }
  .target-card.carbs .target-val { color: var(--yellow); }

  /* ── WEEKLY SUMMARY ── */
  .week-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 8px;
  }
  .week-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    cursor: pointer;
  }
  .week-label {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
  }
  .week-range {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text3);
  }
  .week-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .week-stat { text-align: center; }
  .week-stat-val {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .week-stat-label {
    font-size: 9px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-family: 'Space Mono', monospace;
    margin-top: 2px;
  }
  .adherence-bar-wrap {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 12px;
  }
  .adherence-bar {
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
    transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }
  .adherence-label {
    font-size: 10px;
    color: var(--text3);
    font-family: 'Space Mono', monospace;
    margin-top: 6px;
    text-align: right;
  }

  /* ── SPARKLINE ── */
  .sparkline-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .spark-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 12px 10px;
  }
  .spark-label {
    font-size: 9px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'Space Mono', monospace;
    margin-bottom: 8px;
  }
  .spark-canvas { width: 100%; height: 36px; display: block; }
  .spark-last {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    margin-top: 6px;
  }
  .spark-card.kcal .spark-last { color: var(--blue); }
  .spark-card.protein .spark-last { color: var(--accent); }
  .spark-card.carbs .spark-last { color: var(--yellow); }
  .spark-card.weight .spark-last { color: var(--text2); }

  /* ── HISTORY TABLE ── */
  .history-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .history-row {
    display: grid;
    grid-template-columns: 80px 1fr 1fr 1fr 56px;
    gap: 0;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.15s;
  }
  .history-row:last-child { border-bottom: none; }
  .history-row.header-row {
    background: var(--surface2);
    padding: 8px 14px;
  }
  .history-row.header-row .cell {
    font-size: 9px;
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text3);
    font-weight: 400;
  }
  .cell { font-size: 13px; }
  .cell.date {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text2);
  }
  .cell.kcal { color: var(--blue); font-weight: 500; }
  .cell.protein { color: var(--accent); font-weight: 500; }
  .cell.carbs { color: var(--yellow); font-weight: 500; }
  .cell.weight { color: var(--text2); font-size: 12px; font-family: 'Space Mono', monospace; }
  .cell.mode-badge {
    display: inline-block;
    font-size: 9px;
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .mode-standard { background: var(--green-dim); color: var(--green); }
  .mode-occasion { background: var(--yellow-dim); color: var(--yellow); }
  .mode-holiday  { background: var(--red-dim); color: var(--red); }

  /* ── OVER TARGET HIGHLIGHT ── */
  .history-row.over-carbs { background: rgba(255,94,94,0.04); }
  .history-row.on-target  { background: rgba(45,235,143,0.03); }

  /* ── FOOTER ── */
  .footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .footer-brand {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 4px;
  }
  .footer-sub {
    font-size: 11px;
    color: var(--text3);
    font-family: 'Space Mono', monospace;
  }

  /* ── ERROR STATE ── */
  .error-state {
    text-align: center;
    padding: 60px 20px;
  }
  .error-icon { font-size: 48px; margin-bottom: 16px; }
  .error-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .error-sub { color: var(--text2); font-size: 14px; }

  /* ── PRINT ── */
  @media print {
    body { background: white; color: black; }
    :root {
      --bg: white; --surface: #f8f8f8; --surface2: #eeeeee;
      --border: #cccccc; --text: #111; --text2: #444; --text3: #888;
      --accent: #059669; --blue: #2563eb; --yellow: #d97706; --red: #dc2626;
      --green: #059669;
    }
    .no-print { display: none !important; }
    .history-table { border: 1px solid #ccc; }
  }

  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .page > * { animation: fadeIn 0.4s ease both; }
  .page > *:nth-child(2) { animation-delay: 0.05s; }
  .page > *:nth-child(3) { animation-delay: 0.1s; }
  .page > *:nth-child(4) { animation-delay: 0.15s; }
  .page > *:nth-child(5) { animation-delay: 0.2s; }
</style>
</head>
<body>
<div class="page" id="app">
  <div class="error-state" id="errorState" style="display:none;">
    <div class="error-icon">🔒</div>
    <div class="error-title">No data found</div>
    <div class="error-sub">This link may be invalid or the data could not be decoded.</div>
  </div>
</div>

<script>
(function() {

  // ── DECODE PAYLOAD ──────────────────────────────────────────
  function decode() {
    const hash = window.location.hash.slice(1);
    if (!hash) return null;
    try {
      return JSON.parse(decodeURIComponent(escape(atob(hash))));
    } catch(e) {
      return null;
    }
  }

  // ── FORMAT HELPERS ──────────────────────────────────────────
  function fmt(n, dec) {
    if (n === undefined || n === null || n === 0) return '—';
    return Number(n).toFixed(dec || 0);
  }
  function fmtDate(ddmmyy) {
    if (!ddmmyy) return '—';
    const p = ddmmyy.split('/');
    if (p.length !== 3) return ddmmyy;
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const m = parseInt(p[1]) - 1;
    return `${parseInt(p[0])} ${months[m] || p[1]}`;
  }
  function fmtDateFull(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function isExpired(expiresISO) {
    return new Date(expiresISO) < new Date();
  }

  // ── SPARKLINE ──────────────────────────────────────────────
  function drawSparkline(canvas, values, color) {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.offsetWidth || 100;
    const h = 36;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const valid = values.filter(v => v > 0);
    if (valid.length < 2) {
      ctx.fillStyle = color + '44';
      ctx.fillRect(0, h/2 - 1, w, 2);
      return;
    }

    const min = Math.min(...valid) * 0.9;
    const max = Math.max(...valid) * 1.05;
    const range = max - min || 1;

    const pts = values.map((v, i) => ({
      x: (i / (values.length - 1)) * w,
      y: h - ((( v || min) - min) / range) * (h - 4) - 2
    }));

    // Fill
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, color + '33');
    grad.addColorStop(1, color + '00');
    ctx.beginPath();
    ctx.moveTo(pts[0].x, h);
    pts.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(pts[pts.length-1].x, h);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Line
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Last dot
    const last = pts[pts.length - 1];
    ctx.beginPath();
    ctx.arc(last.x, last.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  // ── WEEKLY CHUNKS ──────────────────────────────────────────
  function chunkWeeks(history) {
    const weeks = [];
    for (let i = 0; i < history.length; i += 7) {
      weeks.push(history.slice(i, i + 7));
    }
    return weeks;
  }

  function weekSummary(days, targets) {
    const logged = days.filter(d => d.totals && d.totals.kcal > 0);
    const avgKcal = logged.length ? Math.round(logged.reduce((s,d) => s + (d.totals.kcal||0), 0) / logged.length) : 0;
    const avgProt = logged.length ? Math.round(logged.reduce((s,d) => s + (d.totals.protein||0), 0) / logged.length) : 0;
    const avgCarbs = logged.length ? Math.round(logged.reduce((s,d) => s + (d.totals.carbs||0), 0) / logged.length) : 0;
    const weights = days.filter(d => d.weight > 0).map(d => d.weight);
    const avgWeight = weights.length ? (weights.reduce((s,w) => s+w, 0) / weights.length).toFixed(1) : null;
    const onTarget = logged.filter(d => {
      const carbLimit = d.mode === 'holiday'  ? (data.ceilings?.holiday  || 100)
                      : d.mode === 'occasion' ? (data.ceilings?.occasion || 75)
                      :                         (data.ceilings?.standard || 50);
      return d.totals.carbs <= carbLimit && d.totals.protein >= (targets.protein * 0.85);
    }).length;
    const adherencePct = logged.length ? Math.round((onTarget / logged.length) * 100) : 0;
    return { avgKcal, avgProt, avgCarbs, avgWeight, adherencePct, logged: logged.length, total: days.length };
  }

  // ── RENDER ─────────────────────────────────────────────────
  function render(data) {
    const app = document.getElementById('app');
    const allHistory = (data.history || []).slice();
    const history = allHistory.slice().reverse().filter(d => d.totals && d.totals.kcal > 0); // newest first, logged days only
    const chronological = allHistory.filter(d => d.totals && d.totals.kcal > 0); // oldest first for sparklines
    const expired = isExpired(data.expires);
    const targets = data.targets || { kcal: 3000, protein: 145, carbs: 50 };

    let html = '';

    // Header
    html += `
      <div class="header">
        <div class="header-brand">MaxedHealth · Carer View</div>
        <div class="header-name">${data.name || 'MaxedHealth User'}</div>
        <div class="header-sub">Generated ${fmtDateFull(data.generated)} · Expires ${fmtDateFull(data.expires)}</div>
      </div>`;

    // Expired banner
    if (expired) {
      html += `<div class="expired-banner">⚠ This report has expired — data may be outdated</div>`;
    }

    // Targets
    html += `<div class="section-title">Daily Targets</div>`;
    html += `<div class="target-row">
      <div class="target-card kcal">
        <div class="target-val">${targets.kcal}</div>
        <div class="target-label">kcal</div>
      </div>
      <div class="target-card protein">
        <div class="target-val">${targets.protein}g</div>
        <div class="target-label">protein</div>
      </div>
      <div class="target-card carbs">
        <div class="target-val">${targets.carbs}g</div>
        <div class="target-label">carbs</div>
      </div>
    </div>`;

    // Sparklines
    if (chronological.length >= 3) {
      html += `<div class="section-title">Trends</div>`;
      html += `<div class="sparkline-row">
        <div class="spark-card kcal">
          <div class="spark-label">Calories</div>
          <canvas class="spark-canvas" id="sparkKcal"></canvas>
          <div class="spark-last">${fmt(chronological[chronological.length-1]?.totals?.kcal)}</div>
        </div>
        <div class="spark-card protein">
          <div class="spark-label">Protein</div>
          <canvas class="spark-canvas" id="sparkProtein"></canvas>
          <div class="spark-last">${fmt(chronological[chronological.length-1]?.totals?.protein)}g</div>
        </div>
        <div class="spark-card carbs">
          <div class="spark-label">Carbs</div>
          <canvas class="spark-canvas" id="sparkCarbs"></canvas>
          <div class="spark-last">${fmt(chronological[chronological.length-1]?.totals?.carbs)}g</div>
        </div>
      </div>`;

      const weights = chronological.map(d => d.weight || 0);
      if (weights.some(w => w > 0)) {
        const lastWeight = chronological.slice().reverse().find(d => d.weight > 0);
        html += `<div class="sparkline-row" style="grid-template-columns:1fr;">
          <div class="spark-card weight" style="grid-column:1/-1;">
            <div class="spark-label">Weight (kg)</div>
            <canvas class="spark-canvas" id="sparkWeight" style="height:44px;"></canvas>
            <div class="spark-last">${lastWeight ? lastWeight.weight + ' kg' : '—'}</div>
          </div>
        </div>`;
      }
    }

    // Weekly summaries
    const weeks = chunkWeeks(chronological);
    if (weeks.length > 0) {
      html += `<div class="section-title">Weekly Summary</div>`;
      weeks.slice().reverse().forEach((week, wi) => {
        const s = weekSummary(week, targets);
        const startDate = week[0]?.date ? fmtDate(week[0].date) : '—';
        const endDate = week[week.length-1]?.date ? fmtDate(week[week.length-1].date) : '—';
        const weekNum = weeks.length - wi;
        html += `
        <div class="week-card">
          <div class="week-header">
            <div class="week-label">Week ${weekNum}</div>
            <div class="week-range">${startDate} – ${endDate}</div>
          </div>
          <div class="week-stats">
            <div class="week-stat">
              <div class="week-stat-val" style="color:var(--blue);">${s.avgKcal || '—'}</div>
              <div class="week-stat-label">avg kcal</div>
            </div>
            <div class="week-stat">
              <div class="week-stat-val" style="color:var(--accent);">${s.avgProt ? s.avgProt + 'g' : '—'}</div>
              <div class="week-stat-label">avg prot</div>
            </div>
            <div class="week-stat">
              <div class="week-stat-val" style="color:var(--yellow);">${s.avgCarbs ? s.avgCarbs + 'g' : '—'}</div>
              <div class="week-stat-label">avg carbs</div>
            </div>
            <div class="week-stat">
              <div class="week-stat-val">${s.avgWeight ? s.avgWeight + 'kg' : '—'}</div>
              <div class="week-stat-label">avg wt</div>
            </div>
          </div>
          <div class="adherence-bar-wrap">
            <div class="adherence-bar" style="width:${s.adherencePct}%; background:${s.adherencePct >= 80 ? 'var(--accent)' : s.adherencePct >= 50 ? 'var(--yellow)' : 'var(--red)'};"></div>
          </div>
          <div class="adherence-label">${s.adherencePct}% on target · ${s.logged}/${s.total} days logged</div>
        </div>`;
      });
    }

    // Day-by-day history
    html += `<div class="section-title">Daily Log</div>`;
    html += `<div class="history-table">
      <div class="history-row header-row">
        <div class="cell">Date</div>
        <div class="cell">Kcal</div>
        <div class="cell">Protein</div>
        <div class="cell">Carbs</div>
        <div class="cell">Mode</div>
      </div>`;

    history.forEach(day => {
      const t = day.totals || {};
      const carbLimit = day.mode === 'holiday'  ? (data.ceilings?.holiday  || 100)
                      : day.mode === 'occasion' ? (data.ceilings?.occasion || 75)
                      :                           (data.ceilings?.standard || 50);
      const overCarbs = t.carbs > carbLimit;
      const onTarget = !overCarbs && t.protein >= (targets.protein * 0.85);
      const rowClass = overCarbs ? 'over-carbs' : onTarget ? 'on-target' : '';
      const modeClass = day.mode === 'occasion' ? 'mode-occasion' : day.mode === 'holiday' ? 'mode-holiday' : 'mode-standard';
      const modeLabel = day.mode === 'occasion' ? 'OCC' : day.mode === 'holiday' ? 'HOL' : 'STD';

      html += `<div class="history-row ${rowClass}">
        <div class="cell date">${fmtDate(day.date)}</div>
        <div class="cell kcal">${fmt(t.kcal)}</div>
        <div class="cell protein">${fmt(t.protein)}${t.protein ? 'g' : ''}</div>
        <div class="cell carbs" style="${overCarbs ? 'color:var(--red);' : ''}">${fmt(t.carbs)}${t.carbs ? 'g' : ''}</div>
        <div class="cell"><span class="cell mode-badge ${modeClass}">${modeLabel}</span></div>
      </div>`;
    });

    html += `</div>`;

    // Footer
    html += `
      <div class="footer">
        <div class="footer-brand">MaxedHealth</div>
        <div class="footer-sub">Read-only · Generated ${fmtDateFull(data.generated)}</div>
        <div class="footer-sub" style="margin-top:4px;">YOUR DATA. YOUR HEALTH. YOUR RULES.</div>
      </div>`;

    app.innerHTML = html;

    // Draw sparklines after DOM update
    requestAnimationFrame(() => {
      const kcalVals = chronological.map(d => d.totals?.kcal || 0);
      const protVals = chronological.map(d => d.totals?.protein || 0);
      const carbVals = chronological.map(d => d.totals?.carbs || 0);
      const wtVals   = chronological.map(d => d.weight || 0);

      const sk = document.getElementById('sparkKcal');
      const sp = document.getElementById('sparkProtein');
      const sc = document.getElementById('sparkCarbs');
      const sw = document.getElementById('sparkWeight');

      if (sk) drawSparkline(sk, kcalVals, '#38bdf8');
      if (sp) drawSparkline(sp, protVals, '#2deb8f');
      if (sc) drawSparkline(sc, carbVals, '#f5c542');
      if (sw) drawSparkline(sw, wtVals, '#8b90a0');
    });
  }

  // ── INIT ───────────────────────────────────────────────────
  const data = decode();
  if (!data) {
    document.getElementById('errorState').style.display = 'block';
  } else {
    render(data);
  }

})();
</script>
</body>
</html>
