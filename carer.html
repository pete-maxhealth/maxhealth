<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxedHealth — Carer View</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0c0f;--surface:#121418;--border:#2a2e38;--text:#e8eaf0;--text2:#8b90a0;--text3:#555a6a;--green:#2deb8f;--yellow:#f5c542;--red:#ef4444;--radius:12px;--radius-sm:8px; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--green);letter-spacing:.08em;}
.badge{font-size:11px;color:var(--text3);font-family:'Space Mono',monospace;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:20px;padding:4px 10px;}
.container{max-width:720px;margin:0 auto;padding:24px 20px 60px;}
.section-title{font-family:'Space Mono',monospace;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:28px 0 12px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:8px;}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 12px;text-align:center;}
.stat-val{font-size:20px;font-weight:700;color:var(--text);line-height:1.2;}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:4px;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.04em;}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.row:last-child{border-bottom:none;}
.row-date{color:var(--text3);font-family:'Space Mono',monospace;font-size:11px;min-width:80px;}
.green{color:var(--green);} .yellow{color:var(--yellow);}
.notice{background:rgba(45,235,143,.06);border:1px solid rgba(45,235,143,.2);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px;}
.error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:var(--radius-sm);padding:20px;text-align:center;color:var(--red);font-size:14px;margin-top:40px;line-height:1.7;}
#loading{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px;}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">MAXHEALTH</div>
  <div class="badge">👁 Carer View — Read Only</div>
</div>
<div class="container">
  <div id="loading">Loading data…</div>
  <div id="content" style="display:none;"></div>
  <div id="error"   style="display:none;" class="error"></div>
</div>
<script>
function load() {
  const hash = window.location.hash.slice(1);
  if (!hash) { showError('No data found. Ask the patient to regenerate the carer view link from Settings → Data.'); return; }
  let snap;
  try { snap = JSON.parse(decodeURIComponent(escape(atob(hash)))); }
  catch(e) { showError('Could not decode data — the link may be corrupted. Ask for a new one.'); return; }
  if (snap.expires && new Date(snap.expires) < new Date()) {
    showError('This link has expired (links are valid for 7 days).\nPlease ask the patient to generate a new carer view link.'); return;
  }
  render(snap);
}

function showError(msg) {
  document.getElementById('loading').style.display='none';
  const el=document.getElementById('error');
  el.innerHTML=msg.replace(/\n/g,'<br>');
  el.style.display='block';
}

function render(snap) {
  document.getElementById('loading').style.display='none';
  const c=document.getElementById('content'); c.style.display='block';
  const h=snap.history||[]; const t=snap.targets||{kcal:3000,protein:145,carbs:50};
  const name=snap.name||'Patient';
  if (!h.length) { showError('No history data in this snapshot.'); return; }
  const n=h.length;
  const av=arr=>Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
  const kcals=h.map(e=>e.totals?.kcal||0);
  const prots=h.map(e=>e.totals?.protein||0);
  const carbs=h.map(e=>e.totals?.carbs||0);
  const on=carbs.filter(c=>c<=t.carbs).length;
  const adh=Math.round(on/n*100);
  let streak=0; for(const e of h){if((e.totals?.carbs||0)<=t.carbs)streak++;else break;}
  const gen=new Date(snap.generated).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const exp=new Date(snap.expires).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  c.innerHTML=`
    <div class="notice">📊 Nutrition data shared by <strong>${name}</strong> on ${gen}. Link expires ${exp}.<br>
    Contains nutrition totals and weights only — no food log entries or personal notes.</div>
    <div class="section-title">Overview — Last ${n} Days</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val">${n}</div><div class="stat-lbl">Days tracked</div></div>
      <div class="stat-box"><div class="stat-val">${av(kcals)}</div><div class="stat-lbl">Avg kcal</div></div>
      <div class="stat-box"><div class="stat-val">${av(prots)}g</div><div class="stat-lbl">Avg protein</div></div>
      <div class="stat-box"><div class="stat-val">${av(carbs)}g</div><div class="stat-lbl">Avg carbs</div></div>
      <div class="stat-box"><div class="stat-val ${adh>=80?'green':'yellow'}">${adh}%</div><div class="stat-lbl">Carb adherence</div></div>
      <div class="stat-box"><div class="stat-val ${streak>=7?'green':''}">${streak}</div><div class="stat-lbl">Day streak</div></div>
    </div>
    <div style="font-size:12px;color:var(--text3);margin-top:4px;margin-bottom:4px;">Targets: ${t.kcal} kcal · ${t.protein}g protein · ${t.carbs}g carb ceiling</div>
    <div class="section-title">Daily Log</div>
    <div class="card">${h.map(e=>{
      const cv=e.totals?.carbs||0; const pv=e.totals?.protein||0; const kv=e.totals?.kcal||0;
      const cc=cv>t.carbs?'yellow':'green'; const ml=e.mode==='holiday'?' 🏖':'';
      return `<div class="row"><span class="row-date">${e.date}${ml}</span><span>${kv} kcal</span><span>${pv}g P</span><span class="${cc}">${cv}g C</span>${e.weight?`<span style="color:var(--text3);font-size:12px;">${e.weight}kg</span>`:''}</div>`;
    }).join('')}</div>`;
}
load();
</script>
</body>
</html>
