<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MaxedHealth — Carer View</title>
<meta name="theme-color" content="#0a0c0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #121418;
    --surface2: #1a1d23;
    --surface3: #22262e;
    --border: #2a2e38;
    --border2: #333844;
    --text: #e8eaf0;
    --text2: #8b90a0;
    --text3: #555a6a;
    --accent: #2deb8f;
    --accent-dim: rgba(45,235,143,0.12);
    --green: #2deb8f;
    --yellow: #f5c542;
    --yellow-dim: rgba(245,197,66,0.12);
    --red: #ff5e5e;
    --red-dim: rgba(255,94,94,0.12);
    --blue: #4d9fff;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ── header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.04em;
  }
  .badge-readonly {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    color: var(--text3);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 2px 6px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .header-meta {
    font-size: 11px;
    color: var(--text3);
    font-family: 'Space Mono', monospace;
  }
  .header-meta span {
    color: var(--text2);
  }

  /* ── expired banner ── */
  .expired-banner {
    background: var(--red-dim);
    border-bottom: 1px solid rgba(255,94,94,0.25);
    padding: 12px 20px;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--red);
    text-align: center;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ── content ── */
  .content {
    padding: 20px 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 24px 0 10px;
  }
  .section-title:first-child { margin-top: 4px; }

  /* ── targets grid ── */
  .targets-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 4px;
  }
  .target-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    text-align: center;
  }
  .target-val {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 4px;
  }
  .target-label {
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ── history table ── */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead tr {
    background: var(--surface2);
  }
  th {
    font-family: 'Syne', sans-serif;
    font-size: 9px;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 10px 10px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }
  th:first-child { text-align: left; }
  td {
    font-size: 12px;
    color: var(--text2);
    padding: 9px 10px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    font-family: 'Space Mono', monospace;
  }
  td:first-child {
    text-align: left;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  .val-good  { color: var(--accent) !important; }
  .val-warn  { color: var(--yellow) !important; }
  .val-bad   { color: var(--red) !important; }
  .val-dim   { color: var(--text3) !important; }

  .mode-badge {
    font-size: 9px;
    font-family: 'Space Mono', monospace;
    padding: 2px 5px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: var(--surface3);
    color: var(--text3);
  }
  .mode-occasion { background: rgba(245,197,66,0.12); color: var(--yellow); }
  .mode-holiday  { background: rgba(255,94,94,0.12);  color: var(--red); }

  /* ── error / empty states ── */
  .state-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
  }
  .state-icon { font-size: 40px; margin-bottom: 16px; }
  .state-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .state-body { font-size: 13px; color: var(--text3); line-height: 1.6; }

  /* ── footer ── */
  .footer {
    text-align: center;
    padding: 32px 20px 0;
    font-size: 11px;
    color: var(--text3);
    line-height: 1.8;
    font-family: 'Space Mono', monospace;
  }
  .footer-logo {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 800;
    color: var(--text3);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">MAXEDHEALTH</div>
    <div class="badge-readonly">👁 Read Only</div>
  </div>
  <div class="header-meta" id="headerMeta">Loading…</div>
</div>

<div id="expiredBanner" class="expired-banner" style="display:none;">
  ⚠ This link has expired — please request a new one
</div>

<div class="content" id="content">
  <div class="state-card">
    <div class="state-icon">⏳</div>
    <div class="state-title">Loading</div>
    <div class="state-body">Reading health snapshot…</div>
  </div>
</div>

<script>
(function() {

  // ── decode payload ────────────────────────────────────────
  function getSnapshot() {
    try {
      const hash = window.location.hash.slice(1);
      if (!hash) return null;
      return JSON.parse(decodeURIComponent(escape(atob(hash))));
    } catch(e) {
      return null;
    }
  }

  // ── formatting helpers ────────────────────────────────────
  function fmtDate(str) {
    // Accepts DD/MM/YY or YYYY-MM-DD
    if (!str) return '—';
    if (str.includes('/')) {
      const [d,m,y] = str.split('/');
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${parseInt(d)} ${months[parseInt(m)-1]} 20${y}`;
    }
    const d = new Date(str);
    if (isNaN(d)) return str;
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  }

  function fmtISO(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function val(v, unit, decimals) {
    if (v === null || v === undefined || v === '') return '—';
    const n = parseFloat(v);
    if (isNaN(n)) return '—';
    return (decimals !== undefined ? n.toFixed(decimals) : Math.round(n)) + (unit || '');
  }

  function kcalClass(kcal, target) {
    if (!kcal || !target) return 'val-dim';
    const pct = kcal / target;
    if (pct >= 0.85) return 'val-good';
    if (pct >= 0.65) return 'val-warn';
    return 'val-bad';
  }

  function protClass(prot, target) {
    if (!prot || !target) return 'val-dim';
    if (prot >= target) return 'val-good';
    if (prot >= target * 0.8) return 'val-warn';
    return 'val-bad';
  }

  function carbClass(carbs, ceiling) {
    if (carbs === null || carbs === undefined || carbs === '') return 'val-dim';
    const n = parseFloat(carbs);
    if (isNaN(n)) return 'val-dim';
    if (n <= ceiling) return 'val-good';
    if (n <= ceiling * 1.2) return 'val-warn';
    return 'val-bad';
  }

  function modeBadge(mode) {
    if (!mode || mode === 'standard') return '<span class="mode-badge">Std</span>';
    if (mode === 'occasion') return '<span class="mode-badge mode-occasion">Occ</span>';
    if (mode === 'holiday')  return '<span class="mode-badge mode-holiday">Hol</span>';
    return '<span class="mode-badge">' + mode + '</span>';
  }

  // ── render ────────────────────────────────────────────────
  function render(snap) {
    const content = document.getElementById('content');
    const headerMeta = document.getElementById('headerMeta');

    const name      = snap.name || 'MaxedHealth User';
    const generated = fmtISO(snap.generated);
    const expires   = snap.expires ? new Date(snap.expires) : null;
    const isExpired = expires && new Date() > expires;
    const targets   = snap.targets || {};
    const std       = targets.standard || {};
    const history   = (snap.history || []).slice().reverse(); // most recent first

    // Header
    headerMeta.innerHTML = `<span>${name}</span> &nbsp;·&nbsp; Generated ${generated}`;

    // Expired banner
    if (isExpired) {
      document.getElementById('expiredBanner').style.display = 'block';
    }

    // Build page
    let html = '';

    // ── targets ──
    html += '<div class="section-title">Daily Targets</div>';
    html += '<div class="targets-grid">';
    html += `<div class="target-card"><div class="target-val">${std.kcal || '—'}</div><div class="target-label">kcal</div></div>`;
    html += `<div class="target-card"><div class="target-val">${std.protein || '—'}<span style="font-size:14px;color:var(--text3);">g</span></div><div class="target-label">Protein</div></div>`;
    html += `<div class="target-card"><div class="target-val">${std.carbs || '—'}<span style="font-size:14px;color:var(--text3);">g</span></div><div class="target-label">Carb ceiling</div></div>`;
    html += '</div>';

    // ── history table ──
    if (history.length === 0) {
      html += '<div class="section-title">Nutrition History</div>';
      html += '<div class="state-card"><div class="state-icon">📭</div><div class="state-title">No history</div><div class="state-body">No nutrition data was included in this snapshot.</div></div>';
    } else {
      // Summary stats
      const daysLogged = history.filter(e => e.totals && e.totals.kcal > 0).length;
      const carbCeiling = std.carbs || 50;
      const daysInKetosis = history.filter(e => {
        if (!e.totals) return false;
        const c = e.totals.carbs;
        const mode = e.mode || 'standard';
        const ceiling = mode === 'holiday' ? (targets.holiday||{}).carbs || carbCeiling*2
                      : mode === 'occasion' ? (targets.occasion||{}).carbs || Math.round(carbCeiling*1.5)
                      : carbCeiling;
        return c !== undefined && c <= ceiling;
      }).length;
      const proteinDays = history.filter(e => e.totals && e.totals.protein >= (std.protein || 145)).length;
      const avgKcal = daysLogged > 0
        ? Math.round(history.filter(e=>e.totals&&e.totals.kcal>0).reduce((s,e)=>s+e.totals.kcal,0) / daysLogged)
        : null;

      html += '<div class="section-title">Period Summary</div>';
      html += '<div class="targets-grid">';
      html += `<div class="target-card"><div class="target-val" style="color:var(--text);">${daysLogged}</div><div class="target-label">Days logged</div></div>`;
      html += `<div class="target-card"><div class="target-val" style="color:var(--accent);">${daysInKetosis}</div><div class="target-label">Within carb ceiling</div></div>`;
      html += `<div class="target-card"><div class="target-val" style="color:var(--blue);">${avgKcal || '—'}</div><div class="target-label">Avg kcal</div></div>`;
      html += '</div>';

      html += '<div class="section-title">Nutrition History</div>';
      html += '<div class="table-wrap"><table>';
      html += `<thead><tr>
        <th>Date</th>
        <th>kcal</th>
        <th>Protein</th>
        <th>Carbs</th>
        <th>Weight</th>
        <th>Mode</th>
      </tr></thead><tbody>`;

      history.forEach(entry => {
        const t = entry.totals || {};
        const mode = entry.mode || 'standard';
        const ceiling = mode === 'holiday' ? (targets.holiday||{}).carbs || carbCeiling*2
                      : mode === 'occasion' ? (targets.occasion||{}).carbs || Math.round(carbCeiling*1.5)
                      : carbCeiling;

        const kcalVal   = t.kcal    !== undefined ? t.kcal    : null;
        const protVal   = t.protein !== undefined ? t.protein : null;
        const carbsVal  = t.carbs   !== undefined ? t.carbs   : null;
        const wtVal     = entry.weight || null;

        const noData = !kcalVal && !protVal && !carbsVal;

        html += `<tr>
          <td>${fmtDate(entry.date)}</td>
          <td class="${noData ? 'val-dim' : kcalClass(kcalVal, std.kcal)}">${val(kcalVal)}</td>
          <td class="${noData ? 'val-dim' : protClass(protVal, std.protein)}">${val(protVal, 'g')}</td>
          <td class="${noData ? 'val-dim' : carbClass(carbsVal, ceiling)}">${val(carbsVal, 'g')}</td>
          <td class="${wtVal ? '' : 'val-dim'}">${val(wtVal, 'kg', 1)}</td>
          <td>${modeBadge(mode)}</td>
        </tr>`;
      });

      html += '</tbody></table></div>';

      // Colour key
      html += `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding:0 2px;">
        <div style="font-size:11px;color:var(--text3);"><span style="color:var(--accent);">■</span> On target</div>
        <div style="font-size:11px;color:var(--text3);"><span style="color:var(--yellow);">■</span> Below target</div>
        <div style="font-size:11px;color:var(--text3);"><span style="color:var(--red);">■</span> Off target</div>
        <div style="font-size:11px;color:var(--text3);"><span style="color:var(--text3);">■</span> No data</div>
      </div>`;
    }

    // ── privacy note ──
    html += `<div style="margin-top:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;">
      <div style="font-family:'Syne',sans-serif;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;">Privacy</div>
      <div style="font-size:12px;color:var(--text3);line-height:1.7;">
        This view contains nutrition totals and weights only. No food log entries, notes, or personal health context are included.
        ${expires ? `This link expires <strong style="color:var(--text2);">${fmtISO(snap.expires)}</strong>.` : ''}
      </div>
    </div>`;

    content.innerHTML = html;
  }

  // ── error states ─────────────────────────────────────────
  function showError(title, body) {
    document.getElementById('content').innerHTML = `
      <div class="state-card">
        <div class="state-icon">⚠️</div>
        <div class="state-title">${title}</div>
        <div class="state-body">${body}</div>
      </div>`;
    document.getElementById('headerMeta').textContent = 'Unable to load snapshot';
  }

  // ── init ─────────────────────────────────────────────────
  const snap = getSnapshot();

  if (!snap) {
    showError(
      'No data found',
      'This link doesn\'t contain a valid health snapshot. Ask the patient to generate a new carer link from their MaxedHealth app.'
    );
  } else {
    render(snap);
  }

})();
</script>

<div class="footer">
  <div class="footer-logo">MAXEDHEALTH</div>
  <div style="margin-top:4px;">Read-only carer view &nbsp;·&nbsp; YOUR DATA. YOUR HEALTH. YOUR RULES.</div>
</div>

</body>
</html>
