<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxedHealth — Carer View</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a0d;--surface:#0f1215;--surface2:#141820;--border:#1e2228;--text:#f0f2f7;--text2:#7a808f;--text3:#3d4450;--accent:#2deb8f;--accent-dim:rgba(45,235,143,0.08);--accent-glow:rgba(45,235,143,0.18);--yellow:#f5c542;--red:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100svh;}

/* NAV */
nav{background:rgba(8,10,13,0.9);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(24px);position:sticky;top:0;z-index:100;}
.nav-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);text-shadow:0 0 24px var(--accent-glow);}
.nav-logo em{color:var(--text2);font-style:normal;}
.nav-badge{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);font-family:'Syne',sans-serif;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:6px 14px;}
.nav-badge::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);}

/* CONTAINER */
.container{max-width:780px;margin:0 auto;padding:48px 32px 80px;}

/* LOADING */
#loading{text-align:center;padding:100px 20px;}
.loading-logo{font-family:'Syne',sans-serif;font-size:clamp(32px,6vw,52px);font-weight:800;letter-spacing:-0.02em;color:var(--text3);margin-bottom:16px;}
.loading-sub{font-size:14px;color:var(--text3);font-weight:300;}

/* ERROR */
.error-wrap{text-align:center;padding:80px 24px;}
.error-icon{font-size:48px;margin-bottom:24px;}
.error-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--red);margin-bottom:12px;letter-spacing:-0.02em;}
.error-body{font-size:16px;color:var(--text2);line-height:1.8;font-weight:300;max-width:480px;margin:0 auto;}

/* NOTICE BANNER */
.notice{background:var(--accent-dim);border:1px solid rgba(45,235,143,0.15);border-radius:12px;padding:20px 24px;margin-bottom:40px;font-size:14px;color:var(--text2);line-height:1.7;font-weight:300;}
.notice strong{color:var(--text);font-weight:500;}

/* PATIENT HEADER */
.patient-header{margin-bottom:48px;}
.patient-eyebrow{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
.patient-name{font-family:'Syne',sans-serif;font-size:clamp(36px,7vw,64px);font-weight:800;letter-spacing:-0.03em;line-height:1.0;color:var(--text);margin-bottom:8px;}
.patient-meta{font-size:14px;color:var(--text3);font-weight:300;}

/* SECTION */
.section-label{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);margin:40px 0 20px;display:flex;align-items:center;gap:12px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px;}
@media(max-width:500px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--surface);padding:24px 20px;}
.stat-val{font-family:'Syne',sans-serif;font-size:clamp(24px,5vw,36px);font-weight:800;letter-spacing:-0.03em;line-height:1;margin-bottom:6px;}
.stat-val.good{color:var(--accent);}
.stat-val.warn{color:var(--yellow);}
.stat-val.neutral{color:var(--text);}
.stat-lbl{font-size:11px;color:var(--text3);font-family:'Syne',sans-serif;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;}
.stat-sub{font-size:12px;color:var(--text3);margin-top:4px;font-weight:300;}

/* TARGETS ROW */
.targets{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;}
.target-item{font-size:13px;color:var(--text2);font-weight:300;}
.target-item strong{color:var(--text);font-weight:500;}

/* DAILY LOG TABLE */
.log-table{width:100%;border-collapse:collapse;}
.log-table thead tr{border-bottom:1px solid var(--border);}
.log-table th{padding:10px 14px;text-align:left;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);}
.log-table th:not(:first-child){text-align:right;}
.log-table td{padding:12px 14px;font-size:14px;border-bottom:1px solid var(--border);font-weight:300;}
.log-table tr:last-child td{border-bottom:none;}
.log-table tr:hover td{background:rgba(255,255,255,0.01);}
.log-table td:first-child{font-family:'Syne',sans-serif;font-size:12px;font-weight:600;color:var(--text2);letter-spacing:0.04em;}
.log-table td:not(:first-child){text-align:right;color:var(--text2);}
td.carb-ok{color:var(--accent)!important;}
td.carb-over{color:var(--yellow)!important;}
td.weight-cell{color:var(--text3)!important;}
.mode-chip{font-size:10px;margin-left:6px;opacity:0.7;}

/* WRAP */
.log-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}

footer{border-top:1px solid var(--border);padding:32px;text-align:center;font-size:12px;color:var(--text3);font-family:'Syne',sans-serif;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;}
footer a{color:var(--accent);text-decoration:none;}

@media(max-width:600px){
  nav{padding:14px 20px;}
  .container{padding:32px 20px 60px;}
  .log-table th:nth-child(4),.log-table td:nth-child(4){display:none;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">MAXED<em>HEALTH</em></div>
  <div class="nav-badge">Carer View — Read Only</div>
</nav>

<div class="container">
  <div id="loading">
    <div class="loading-logo">MAXED<span style="color:var(--text3);">HEALTH</span></div>
    <div class="loading-sub">Loading shared data…</div>
  </div>
  <div id="content" style="display:none;"></div>
  <div id="error"   style="display:none;"></div>
</div>

<footer>
  <a href="maxhealth.html">MaxedHealth</a> &nbsp;·&nbsp; Read-only view &nbsp;·&nbsp; No data stored on this page
</footer>

<script>
function load() {
  const hash = window.location.hash.slice(1);
  if (!hash) { showError('No data found.', 'Ask the patient to regenerate the carer view link from Settings → Data in MaxedHealth.'); return; }
  let snap;
  try { snap = JSON.parse(decodeURIComponent(escape(atob(hash)))); }
  catch(e) { showError('Could not decode data.', 'The link may be corrupted or incomplete. Ask the patient for a new carer view link.'); return; }
  if (snap.expires && new Date(snap.expires) < new Date()) {
    const exp = new Date(snap.expires).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
    showError('This link expired on ' + exp + '.', 'Carer view links are valid for 7 days. Ask the patient to generate a new one from Settings → Data → Generate Carer View Link.');
    return;
  }
  render(snap);
}

function showError(title, body) {
  document.getElementById('loading').style.display='none';
  const el = document.getElementById('error');
  el.style.display = 'block';
  el.innerHTML = `<div class="error-wrap">
    <div class="error-icon">⚠️</div>
    <div class="error-title">${title}</div>
    <div class="error-body">${body}</div>
  </div>`;
}

function render(snap) {
  document.getElementById('loading').style.display='none';
  const c = document.getElementById('content');
  c.style.display = 'block';

  const h    = snap.history || [];
  const t    = snap.targets || { kcal: 3000, protein: 145, carbs: 50 };
  const name = snap.name || 'Patient';

  if (!h.length) { showError('No history data.', 'This snapshot contains no nutrition history.'); return; }

  const n    = h.length;
  const av   = arr => Math.round(arr.reduce((a,b) => a+b, 0) / arr.length);
  const kcals = h.map(e => e.totals?.kcal    || 0);
  const prots = h.map(e => e.totals?.protein || 0);
  const carbs = h.map(e => e.totals?.carbs   || 0);
  const on    = carbs.filter(c => c <= t.carbs).length;
  const adh   = Math.round(on / n * 100);
  let streak  = 0;
  for (const e of h) { if ((e.totals?.carbs || 0) <= t.carbs) streak++; else break; }

  const gen = new Date(snap.generated).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const exp = new Date(snap.expires).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

  const adhClass  = adh  >= 80 ? 'good' : 'warn';
  const strkClass = streak >= 7 ? 'good' : 'neutral';

  c.innerHTML = `
    <div class="notice">
      Data shared by <strong>${name}</strong> on ${gen}. This link expires ${exp}.
      Contains <strong>nutrition totals and weights only</strong> — no individual food log entries, no personal notes.
    </div>

    <div class="patient-header">
      <div class="patient-eyebrow">Patient data</div>
      <div class="patient-name">${name}</div>
      <div class="patient-meta">Last ${n} days &nbsp;·&nbsp; Generated ${gen}</div>
    </div>

    <div class="section-label">Overview</div>
    <div class="stat-grid">
      <div class="stat">
        <div class="stat-val neutral">${n}</div>
        <div class="stat-lbl">Days tracked</div>
      </div>
      <div class="stat">
        <div class="stat-val neutral">${av(kcals)}<span style="font-size:16px;font-weight:400;"> kcal</span></div>
        <div class="stat-lbl">Avg calories</div>
        <div class="stat-sub">target ${t.kcal} kcal</div>
      </div>
      <div class="stat">
        <div class="stat-val neutral">${av(prots)}<span style="font-size:16px;font-weight:400;">g</span></div>
        <div class="stat-lbl">Avg protein</div>
        <div class="stat-sub">target ${t.protein}g</div>
      </div>
      <div class="stat">
        <div class="stat-val neutral">${av(carbs)}<span style="font-size:16px;font-weight:400;">g</span></div>
        <div class="stat-lbl">Avg carbs</div>
        <div class="stat-sub">ceiling ${t.carbs}g</div>
      </div>
      <div class="stat">
        <div class="stat-val ${adhClass}">${adh}<span style="font-size:16px;font-weight:400;">%</span></div>
        <div class="stat-lbl">Carb adherence</div>
        <div class="stat-sub">${on}/${n} days within ceiling</div>
      </div>
      <div class="stat">
        <div class="stat-val ${strkClass}">${streak}</div>
        <div class="stat-lbl">Day streak</div>
        <div class="stat-sub">consecutive days on target</div>
      </div>
    </div>

    <div class="targets">
      <div class="target-item"><strong>Calorie target:</strong> ${t.kcal} kcal/day</div>
      <div class="target-item"><strong>Protein target:</strong> ${t.protein}g/day</div>
      <div class="target-item"><strong>Carb ceiling:</strong> ${t.carbs}g/day</div>
    </div>

    <div class="section-label">Daily Log</div>
    <div class="log-wrap">
      <table class="log-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Calories</th>
            <th>Protein</th>
            <th>Carbs</th>
            <th>Weight</th>
          </tr>
        </thead>
        <tbody>
          ${h.map(e => {
            const cv = e.totals?.carbs   || 0;
            const pv = e.totals?.protein || 0;
            const kv = e.totals?.kcal    || 0;
            const wv = e.weight          || null;
            const carbClass = cv > t.carbs ? 'carb-over' : 'carb-ok';
            const modeChip  = e.mode === 'holiday' ? '<span class="mode-chip">🏖</span>' : '';
            return `<tr>
              <td>${e.date}${modeChip}</td>
              <td>${kv} kcal</td>
              <td>${pv}g</td>
              <td class="${carbClass}">${cv}g</td>
              <td class="weight-cell">${wv ? wv + 'kg' : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

load();
</script>
</body>
</html>
